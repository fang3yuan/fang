<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الوقت في الدول العربية</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #cfe9ff, #ffffff);
      padding: 2rem;
      margin: 0;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      color: #1e3a8a;
      margin-bottom: 1.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    .card {
      background: white;
      border-radius: 1rem;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      direction: rtl;
    }
    .card img {
      width: 40px;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 0 4px rgba(0,0,0,0.2);
    }
    .info {
      text-align: right;
    }
    .name {
      font-weight: bold;
      font-size: 1.1rem;
      color: #333;
    }
    .time {
      color: #2563eb;
      font-size: 0.9rem;
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>
  <h1>الوقت الحالي في الدول العربية</h1>
  <div class="grid" id="countries"></div>

  <script>
    const countries = [
      { name: "السعودية", code: "sa", timezone: "Asia/Riyadh" },
      { name: "مصر", code: "eg", timezone: "Africa/Cairo" },
      { name: "الإمارات", code: "ae", timezone: "Asia/Dubai" },
      { name: "المغرب", code: "ma", timezone: "Africa/Casablanca" },
      { name: "العراق", code: "iq", timezone: "Asia/Baghdad" },
      { name: "الجزائر", code: "dz", timezone: "Africa/Algiers" },
      { name: "سوريا", code: "sy", timezone: "Asia/Damascus" },
      { name: "قطر", code: "qa", timezone: "Asia/Qatar" },
      { name: "الكويت", code: "kw", timezone: "Asia/Kuwait" },
      { name: "عمان", code: "om", timezone: "Asia/Muscat" },
      { name: "تونس", code: "tn", timezone: "Africa/Tunis" },
      { name: "البحرين", code: "bh", timezone: "Asia/Bahrain" },
      { name: "لبنان", code: "lb", timezone: "Asia/Beirut" },
      { name: "اليمن", code: "ye", timezone: "Asia/Aden" },
      { name: "فلسطين", code: "ps", timezone: "Asia/Gaza" },
      { name: "السودان", code: "sd", timezone: "Africa/Khartoum" },
      { name: "جيبوتي", code: "dj", timezone: "Africa/Djibouti" },
      { name: "موريتانيا", code: "mr", timezone: "Africa/Nouakchott" },
      { name: "جزر القمر", code: "km", timezone: "Indian/Comoro" }
    ];

    const container = document.getElementById('countries');

    function updateTimes() {
      container.innerHTML = '';
      countries.forEach(country => {
        const date = new Date().toLocaleTimeString('ar-EG', {
          timeZone: country.timezone,
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="https://flagcdn.com/w40/${country.code}.png" alt="${country.name}" />
          <div class="info">
            <div class="name">${country.name}</div>
            <div class="time">${date}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    updateTimes();
    setInterval(updateTimes, 1000);
  </script>
</body>
</html>
